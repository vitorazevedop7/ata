appId: io.github.vitorazevedop7.ata
productName: Ata
copyright: Copyright © 2026 Vitor Augusto Viana Azevedo
directories:
  buildResources: build
# Only the compiled app and its icon go into the package (package.json is always included).
files:
  - out/**/*
  - resources/**/*
asarUnpack:
  - resources/**
win:
  executableName: ata
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSMicrophoneUsageDescription: O Ata usa o microfone para gravar a sua voz nas reuniões.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# No auto-update server: new versions are installed from the GitHub releases.
publish: null
